name: Rebuild contribution city

# Checks the contribution graph every 5 minutes (GitHub's shortest schedule)
# and on every change to the scripts. assets/city-*.svg is committed only when
# the picture actually changed, i.e. after new activity or when the day rolls
# over. Bot commits are not counted as contributions, so this never loops.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/city.yml"

permissions:
  contents: write

concurrency:
  group: city
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install fonttools brotli

      # Private contributions: if a CITY_TOKEN secret exists (a personal access
      # token of the profile owner), the calendar is read as the owner and
      # includes private work. Otherwise the built-in token is used, which sees
      # private contributions only when "Private contributions" is switched on
      # in the profile's contribution settings.
      - name: Render city from contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.CITY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/city.py --login "${{ github.repository_owner }}"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city-dark.svg assets/city-light.svg
          if git diff --cached --quiet; then
            echo "City unchanged."
          else
            git commit -q -m "Rebuild contribution city"
            git pull -q --rebase && git push -q
          fi
