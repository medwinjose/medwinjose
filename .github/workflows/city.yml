name: Rebuild contribution city

# Rebuilds the contribution city every hour and on every change to the
# scripts, committing assets/city-*.svg only when the picture changed.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/city.yml"

permissions:
  contents: write

concurrency:
  group: city
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install fonttools brotli

      - name: Render city from contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/city.py --login "${{ github.repository_owner }}"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city-dark.svg assets/city-light.svg
          if git diff --cached --quiet; then
            echo "City unchanged."
          else
            git commit -q -m "Rebuild contribution city"
            git pull -q --rebase && git push -q
          fi
