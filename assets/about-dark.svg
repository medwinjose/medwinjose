d"/><path d="M120 187 Q150 204 180 187" fill="none" stroke="#FFB4C8" stroke-width="2.2" stroke-linecap="round"/><g class="kn-head"><path d="M115 116 C106 98 100 78 106 52 C114 72 124 90 138 106 Z" fill="#F8F6FF" stroke="#2B2944" stroke-width="2.2" stroke-linejoin="round"/><path d="M185 116 C194 98 200 78 194 52 C186 72 176 90 162 106 Z" fill="#F8F6FF" stroke="#2B2944" stroke-width="2.2" stroke-linejoin="round"/><path d="M106 136 C106 98 194 98 194 136 C194 170 176 186 150 186 C124 186 106 170 106 136 Z" fill="#F8F6FF" stroke="#2B2944" stroke-width="2.2"/><path d="M114 160 C122 176 136 182 150 182" fill="none" stroke="#DCD6F2" stroke-width="2" stroke-linecap="round" opacity=".7"/><g class="kn-eyes"><g class="kn-open"><g class="kn-blink"><ellipse cx="131" cy="143" rx="10.5" ry="16" fill="#0F0E17"/><ellipse cx="169" cy="143" rx="10.5" ry="16" fill="#0F0E17"/><circle cx="127" cy="135" r="2.6" fill="#FFFFFF" opacity=".85"/><circle cx="165" cy="135" r="2.6" fill="#FFFFFF" opacity=".85"/></g></g><g class="kn-happy" fill="none" stroke="#0F0E17" stroke-width="4.5" stroke-linecap="round"><path d="M121 147 Q131 133 141 147"/><path d="M159 147 Q169 133 179 147"/></g></g><ellipse cx="121" cy="164" rx="6" ry="3" fill="#FFB4C8" opacity=".55"/><ellipse cx="179" cy="164" rx="6" ry="3" fill="#FFB4C8" opacity=".55"/></g><g class="kn-q"><text x="212" y="92" class="f-serif-bi" font-size="34" fill="#FFB4C8">?</text></g><path class="kn-spark" d="M214 75 Q215.44 82.56 223 84 Q215.44 85.44 214 93 Q212.56 85.44 205 84 Q212.56 82.56 214 75 Z" fill="#93E6CC" style="animation-delay:0s"/><path class="kn-spark" d="M90 94 Q90.96 99.04 96 100 Q90.96 100.96 90 106 Q89.04 100.96 84 100 Q89.04 99.04 90 94 Z" fill="#FFB4C8" style="animation-delay:0.15s"/></g></g></g><g class="ab" style="animation-delay:0.10s"><text x="246" y="16" font-size="15" fill="#F4F1FB" xml:space="preserve"><tspan class="f-sans">I study and build</tspan><tspan class="f-sans-sb"> systems that stay correct when some of their participants</tspan></text></g><g class="ab" style="animation-delay:0.16s"><text x="246" y="41" font-size="15" fill="#F4F1FB" xml:space="preserve"><tspan class="f-sans-sb">misbehave</tspan><tspan class="f-sans">: networks where peers lie, markets where traders game the order</tspan></text></g><g class="ab" style="animation-delay:0.22s"><text x="246" y="66" font-size="15" fill="#F4F1FB" xml:space="preserve"><tspan class="f-sans">book, and pipelines where one bad input should never take everything down. My</tspan></text></g><g class="ab" style="animation-delay:0.28s"><text x="246" y="91" font-size="15" fill="#F4F1FB" xml:space="preserve"><tspan class="f-sans">work sits where distributed systems meet security, mostly in Rust.</tspan></text></g><g class="ab" style="animation-delay:0.34s"><text x="246" y="131" font-size="15" fill="#F4F1FB" xml:space="preserve"><tspan class="f-sans">I like the unglamorous parts of engineering: specifying behaviour before writing</tspan></text></g><g class="ab" style="animation-delay:0.40s"><text x="246" y="156" font-size="15" fill="#F4F1FB" xml:space="preserve"><tspan class="f-sans">code, testing properties instead of examples, and publishing every number with</tspan></text></g><g class="ab" style="animation-delay:0.46s"><text x="246" y="181" font-size="15" fill="#F4F1FB" xml:space="preserve"><tspan class="f-sans">the command that produced it.</tspan></text></g><g class="ab" style="animation-delay:0.52s"><text x="246" y="221" class="f-sans-sb" font-size="15" fill="#F4F1FB">Research interests</text><polygon points="395.9,214.2 398.1,216.4 395.9,218.6 393.7,216.4" fill="#B7AAFF" stroke="none" stroke-width="1" /><text x="407.9" y="221" class="f-sans" font-size="15" fill="#CBC6DC">distributed systems</text><polygon points="560.91,214.2 563.11,216.4 560.91,218.6 558.71,216.4" fill="#B7AAFF" stroke="none" stroke-width="1" /><text x="572.91" y="221" class="f-sans" font-size="15" fill="#CBC6DC">formal methods</text><polygon points="698.27,214.2 700.47,216.4 698.27,218.6 696.07,216.4" fill="#B7AAFF" stroke="none" stroke-width="1" /><text x="710.27" y="221" class="f-sans" font-size="15" fill="#CBC6DC">security</text></g></svg>
