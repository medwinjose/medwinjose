<svg xmlns="http://www.w3.org/2000/svg" width="840" height="116" viewBox="0 0 840 116" role="img" aria-label="Thank you for reading"><title>Thank you for reading</title><style>@font-face { font-family: 'MJ-sans-m'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'MJ-serif-i'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: italic; }
.f-sans-m { font-family: 'MJ-sans-m', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 500; font-style: normal; }
.f-serif-i { font-family: 'MJ-serif-i', Georgia, 'Times New Roman', serif; font-weight: 500; font-style: italic; font-feature-settings: 'lnum' 1, 'kern' 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes drawx { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes drawy { from { transform: scaleY(0) } to { transform: scaleY(1) } }
@keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
.fb { transform-box: fill-box; }

.rl { transform-box: fill-box; transform-origin: 100% 50%; animation: drawx 1.8s cubic-bezier(.16,1,.3,1) .2s both; }
.rr { transform-box: fill-box; transform-origin: 0 50%; animation: drawx 1.8s cubic-bezier(.16,1,.3,1) .2s both; }
.dm { animation: fade 1s ease-out .8s both, breathe 5s ease-in-out 2s infinite; }
.tx { animation: rise 1.4s cubic-bezier(.16,1,.3,1) .6s both; }
.cl { animation: fade 1.6s ease-out 1.1s both; }
</style><line class="rl" x1="230.0" y1="38" x2="408.0" y2="38" stroke="#B7AAFF" stroke-width=".8" opacity=".6"/><line class="rr" x1="432.0" y1="38" x2="610.0" y2="38" stroke="#B7AAFF" stroke-width=".8" opacity=".6"/><g class="dm"><polygon points="420,34.2 423.8,38 420,41.8 416.2,38" fill="none" stroke="#FFB4C8" stroke-width="1" /><polygon points="420,36.5 421.5,38 420,39.5 418.5,38" fill="#FFB4C8" stroke="none" stroke-width="1" /></g><g class="tx"><text x="420" y="80" class="f-serif-i" font-size="20" fill="#CBC6DC" text-anchor="middle">Thank you for reading.</text></g><g class="cl"><text x="422.25" y="110" class="f-sans-m" font-size="9" fill="#9893AD" text-anchor="middle" letter-spacing="4.5">MEDWIN JOSE</text></g></svg>
