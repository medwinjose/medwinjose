<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170" role="img" aria-label="Thank you for reading"><title>Thank you for reading</title><style>@font-face { font-family: 'MJ-sans'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'MJ-sans-m'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'MJ-serif-i'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: italic; }
.f-sans { font-family: 'MJ-sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 400; font-style: normal; }
.f-sans-m { font-family: 'MJ-sans-m', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 500; font-style: normal; }
.f-serif-i { font-family: 'MJ-serif-i', Georgia, 'Times New Roman', serif; font-weight: 500; font-style: italic; font-feature-settings: 'lnum' 1, 'kern' 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes drawx { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes drawy { from { transform: scaleY(0) } to { transform: scaleY(1) } }
@keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
.fb { transform-box: fill-box; }

.rl { transform-box: fill-box; transform-origin: 100% 50%; animation: drawx 1.8s cubic-bezier(.16,1,.3,1) .2s both; }
.rr { transform-box: fill-box; transform-origin: 0 50%; animation: drawx 1.8s cubic-bezier(.16,1,.3,1) .2s both; }
.dm { animation: fade 1s ease-out .8s both, breathe 5s ease-in-out 2s infinite; }
.tx { animation: rise 1.4s cubic-bezier(.16,1,.3,1) .6s both; }
.cl { animation: fade 1.6s ease-out 1.1s both; }
</style><line class="rl" x1="210.0" y1="40" x2="406.0" y2="40" stroke="#6D5BDB" stroke-width=".8" opacity=".6"/><line class="rr" x1="434.0" y1="40" x2="630.0" y2="40" stroke="#6D5BDB" stroke-width=".8" opacity=".6"/><g class="dm"><polygon points="420,35.6 424.4,40 420,44.4 415.6,40" fill="none" stroke="#D8698C" stroke-width="1" /><polygon points="420,38.3 421.7,40 420,41.7 418.3,40" fill="#D8698C" stroke="none" stroke-width="1" /></g><g class="tx"><text x="420" y="88" class="f-serif-i" font-size="22" fill="#4A4561" text-anchor="middle">Thank you for reading.</text></g><g class="cl"><text x="422" y="124" class="f-sans-m" font-size="9.5" fill="#7D7795" text-anchor="middle" letter-spacing="4">MEDWIN JOSE  ·  MMXXVI</text><text x="421.6" y="146" class="f-sans" font-size="8" fill="#B7B1C9" text-anchor="middle" letter-spacing="3.2">SET IN CORMORANT GARAMOND &amp; INTER</text></g></svg>
