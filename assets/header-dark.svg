<svg xmlns="http://www.w3.org/2000/svg" width="840" height="268" viewBox="0 0 840 268" role="img" aria-label="Medwin Jose — distributed systems research and engineering"><title>Medwin Jose — distributed systems research and engineering</title><style>@font-face { font-family: 'MJ-sans-m'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'MJ-serif'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'MJ-serif-i'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: italic; }
.f-sans-m { font-family: 'MJ-sans-m', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 500; font-style: normal; }
.f-serif { font-family: 'MJ-serif', Georgia, 'Times New Roman', serif; font-weight: 500; font-style: normal; font-feature-settings: 'lnum' 1, 'kern' 1; }
.f-serif-i { font-family: 'MJ-serif-i', Georgia, 'Times New Roman', serif; font-weight: 500; font-style: italic; font-feature-settings: 'lnum' 1, 'kern' 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes drawx { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes drawy { from { transform: scaleY(0) } to { transform: scaleY(1) } }
@keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
.fb { transform-box: fill-box; }

.k  { animation: fade 1.4s ease-out .1s both; }
.nm { animation: rise 1.8s cubic-bezier(.16,1,.3,1) .25s both; }
.rl { transform-box: fill-box; transform-origin: 100% 50%; animation: drawx 1.6s cubic-bezier(.16,1,.3,1) 1s both; }
.rr { transform-box: fill-box; transform-origin: 0 50%; animation: drawx 1.6s cubic-bezier(.16,1,.3,1) 1s both; }
.dm { transform-box: fill-box; transform-origin: center; animation: fade 1s ease-out 1.5s both, breathe 5s ease-in-out 2.5s infinite; }
.tl { opacity: 0; animation: cycle 13.5s ease-in-out infinite both; }
.t1 { opacity: 1; animation-delay: 1.9s; } .t2 { animation-delay: 6.4s; } .t3 { animation-delay: 10.9s; }
@keyframes cycle { 0% { opacity: 0; transform: translateY(5px) } 5% { opacity: 1; transform: none }
  29% { opacity: 1; transform: none } 33.3% { opacity: 0; transform: translateY(-4px) } 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .t2, .t3 { display: none } }
.mt { animation: fade 1.6s ease-out 2.3s both; }
</style><defs><linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-60" y2="0"><stop offset="0" stop-color="#F3E2B8" stop-opacity="0"/><stop offset=".5" stop-color="#F3E2B8" stop-opacity=".75"/><stop offset="1" stop-color="#F3E2B8" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1250 0;1250 0" keyTimes="0;.22;1" dur="11s" begin="2.6s" repeatCount="indefinite"/></linearGradient></defs><g class="k"><text x="422.5" y="52" class="f-sans-m" font-size="10.5" fill="#CDAE74" text-anchor="middle" letter-spacing="5">THE PORTFOLIO OF</text><polygon points="314.31,45.9 316.91,48.5 314.31,51.1 311.71,48.5" fill="#CDAE74" stroke="none" stroke-width="1" /><polygon points="525.69,45.9 528.29,48.5 525.69,51.1 523.09,48.5" fill="#CDAE74" stroke="none" stroke-width="1" /></g><g class="nm"><text x="428.5" y="128" class="f-serif" font-size="70" fill="#ECE5D8" text-anchor="middle" letter-spacing="17">MEDWIN JOSE</text><text x="428.5" y="128" class="f-serif" font-size="70" fill="url(#sheen)" text-anchor="middle" letter-spacing="17">MEDWIN JOSE</text></g><line class="rl" x1="262" y1="158" x2="406.0" y2="158" stroke="#CDAE74" stroke-width=".8" opacity=".7"/><line class="rr" x1="434.0" y1="158" x2="578" y2="158" stroke="#CDAE74" stroke-width=".8" opacity=".7"/><g class="dm"><polygon points="420,153.8 424.2,158 420,162.2 415.8,158" fill="none" stroke="#CDAE74" stroke-width="0.9" /><polygon points="420,156.4 421.6,158 420,159.6 418.4,158" fill="#CDAE74" stroke="none" stroke-width="1" /></g><g class="tl t1"><text x="420" y="201" class="f-serif-i" font-size="23.5" fill="#BDB5A6" text-anchor="middle">Building systems that stay correct when participants misbehave.</text></g><g class="tl t2"><text x="420" y="201" class="f-serif-i" font-size="23.5" fill="#BDB5A6" text-anchor="middle">Peer-to-peer protocols, adversarial markets, payment networks.</text></g><g class="tl t3"><text x="420" y="201" class="f-serif-i" font-size="23.5" fill="#BDB5A6" text-anchor="middle">Every claim backed by a benchmark you can rerun.</text></g><g class="mt"><text x="421.6" y="242" class="f-sans-m" font-size="10" fill="#8A8478" text-anchor="middle" letter-spacing="3.2">B.TECH COMPUTER SCIENCE  ·  VIT BHOPAL UNIVERSITY  ·  INDIA</text></g></svg>
