<svg xmlns="http://www.w3.org/2000/svg" width="840" height="180" viewBox="0 0 840 180" role="img" aria-label="Medwin Jose — building systems that stay correct when participants misbehave"><title>Medwin Jose — building systems that stay correct when participants misbehave</title><style>@font-face { font-family: 'MJ-sans-m'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'MJ-serif'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'MJ-serif-i'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: italic; }
.f-sans-m { font-family: 'MJ-sans-m', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 500; font-style: normal; }
