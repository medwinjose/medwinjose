od typography.</text></g><g class="tl t3" style="animation-delay:10.90s"><text x="420" y="132" class="f-serif-i" font-size="19.5" fill="#CBC6DC" text-anchor="middle">Every claim backed by a benchmark you can rerun.</text></g><g class="mt"><text x="421.8" y="165" class="f-sans-m" font-size="8.5" fill="#9893AD" text-anchor="middle" letter-spacing="3.6">SYSTEMS  ·  RESEARCH  ·  ENGINEERING</text></g></svg>
