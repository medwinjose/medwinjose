<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170" role="img" aria-label="Medwin Jose — building systems that stay correct when participants misbehave"><title>Medwin Jose — building systems that stay correct when participants misbehave</title><style>@font-face { font-family: 'MJ-sans-m'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'MJ-serif'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'MJ-serif-i'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: italic; }
.f-sans-m { font-family: 'MJ-sans-m', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 500; font-style: normal; }
.f-serif { font-family: 'MJ-serif', Georgia, 'Times New Roman', serif; font-weight: 500; font-style: normal; font-feature-settings: 'lnum' 1, 'kern' 1; }
.f-serif-i { font-family: 'MJ-serif-i', Georgia, 'Times New Roman', serif; font-weight: 500; font-style: italic; font-feature-settings: 'lnum' 1, 'kern' 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes drawx { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes drawy { from { transform: scaleY(0) } to { transform: scaleY(1) } }
@keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
.fb { transform-box: fill-box; }

.k  { animation: fade 1s ease-out 0s both; }
.nm { animation: rise 1.4s cubic-bezier(.16,1,.3,1) .1s both; }
.rl { transform-box: fill-box; transform-origin: 100% 50%; animation: drawx 1.2s cubic-bezier(.16,1,.3,1) .35s both; }
.rr { transform-box: fill-box; transform-origin: 0 50%; animation: drawx 1.2s cubic-bezier(.16,1,.3,1) .35s both; }
.dm { animation: fade .8s ease-out .6s both, breathe 5s ease-in-out 1.6s infinite; }
.tl { opacity: 0; animation: cycle 18.0s cubic-bezier(.4,0,.2,1) infinite both; }
.t1 { opacity: 1; }
@keyframes cycle { 0% { opacity: 0; transform: translateY(6px) } 4.25% { opacity: 1; transform: none }
  20.75% { opacity: 1; transform: none } 25.00% { opacity: 0; transform: translateY(-6px) } 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .tl:not(.t1) { display: none } }
.mt { animation: fade 1.2s ease-out .9s both; }
</style><defs><linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-40" y2="0"><stop offset="0" stop-color="#B7AAFF" stop-opacity="0"/><stop offset=".35" stop-color="#B7AAFF" stop-opacity=".9"/><stop offset=".65" stop-color="#FFB4C8" stop-opacity=".9"/><stop offset="1" stop-color="#FFB4C8" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1150 0;1150 0" keyTimes="0;.48;1" dur="5.5s" begin="1.6s" repeatCount="indefinite"/></linearGradient></defs><g class="k"><text x="422.25" y="12" class="f-sans-m" font-size="9" fill="#B7AAFF" text-anchor="middle" letter-spacing="4.5">HELLO, I AM</text><polygon points="354.61,6.7 356.91,9 354.61,11.3 352.31,9" fill="#B7AAFF" stroke="none" stroke-width="1" /><polygon points="485.39,6.7 487.69,9 485.39,11.3 483.09,9" fill="#B7AAFF" stroke="none" stroke-width="1" /></g><g class="nm"><text x="425.75" y="66" class="f-serif" font-size="48" fill="#F4F1FB" text-anchor="middle" letter-spacing="11.5">MEDWIN JOSE</text><text x="425.75" y="66" class="f-serif" font-size="48" fill="url(#sheen)" text-anchor="middle" letter-spacing="11.5">MEDWIN JOSE</text></g><line class="rl" x1="318" y1="88" x2="408.0" y2="88" stroke="#B7AAFF" stroke-width=".9" opacity=".75"/><line class="rr" x1="432.0" y1="88" x2="522" y2="88" stroke="#B7AAFF" stroke-width=".9" opacity=".75"/><g class="dm"><polygon points="420,84.2 423.8,88 420,91.8 416.2,88" fill="none" stroke="#FFB4C8" stroke-width="1" /><polygon points="420,86.5 421.5,88 420,89.5 418.5,88" fill="#FFB4C8" stroke="none" stroke-width="1" /></g><g class="tl t1" style="animation-delay:0.55s"><text x="420" y="122" class="f-serif-i" font-size="19.5" fill="#CBC6DC" text-anchor="middle">Quietly obsessed with correctness, latency and good typography.</text></g><g class="tl t2" style="animation-delay:5.05s"><text x="420" y="122" class="f-serif-i" font-size="19.5" fill="#CBC6DC" text-anchor="middle">Every claim backed by a benchmark you can rerun.</text></g><g class="tl t3" style="animation-delay:9.55s"><text x="420" y="122" class="f-serif-i" font-size="19.5" fill="#CBC6DC" text-anchor="middle">Happiest when the proof and the benchmark agree.</text></g><g class="tl t4" style="animation-delay:14.05s"><text x="420" y="122" class="f-serif-i" font-size="19.5" fill="#CBC6DC" text-anchor="middle">Curious by nature: I love research, wherever the question leads.</text></g><g class="mt"><text x="421.8" y="155" class="f-sans-m" font-size="8.5" fill="#9893AD" text-anchor="middle" letter-spacing="3.6">DISTRIBUTED SYSTEMS  ·  SECURITY  ·  RUST</text></g></svg>
