<svg xmlns="http://www.w3.org/2000/svg" width="840" height="262" viewBox="0 0 840 262" role="img" aria-label="Medwin Jose — building systems that stay correct when participants misbehave"><title>Medwin Jose — building systems that stay correct when participants misbehave</title><style>@font-face { font-family: 'MJ-sans-m'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
