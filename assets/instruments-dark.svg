<svg xmlns="http://www.w3.org/2000/svg" width="840" height="212" viewBox="0 0 840 212" role="img" aria-label="Languages, systems, methods and infrastructure"><title>Languages, systems, methods and infrastructure</title><style>@font-face { font-family: 'MJ-sans-sb'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 600; font-style: normal; }
@font-face { font-family: 'MJ-serif'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
.f-sans-sb { font-family: 'MJ-sans-sb', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 600; font-style: normal; }
.f-serif { font-family: 'MJ-serif', Georgia, 'Times New Roman', serif; font-weight: 500; font-style: normal; font-feature-settings: 'lnum' 1, 'kern' 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes drawx { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes drawy { from { transform: scaleY(0) } to { transform: scaleY(1) } }
@keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
.fb { transform-box: fill-box; }

.col { animation: rise 1.3s cubic-bezier(.16,1,.3,1) both; }
.sep { transform-box: fill-box; transform-origin: 50% 0; animation: drawy 1.6s cubic-bezier(.16,1,.3,1) .3s both; }
.ul  { transform-box: fill-box; transform-origin: center; animation: pulse 8s ease-in-out infinite; }
@keyframes pulse { 0%, 70%, 100% { transform: scaleX(1); opacity: 1 } 80% { transform: scaleX(1.9); opacity: .55 } }
