"/><path d="M114 160 C122 176 136 182 150 182" fill="none" stroke="#DCD6F2" stroke-width="2" stroke-linecap="round" opacity=".7"/><g class="eyes"><g class="blink"><ellipse cx="131" cy="143" rx="10.5" ry="16" fill="#0F0E17"/><ellipse cx="169" cy="143" rx="10.5" ry="16" fill="#0F0E17"/><circle cx="127" cy="135" r="2.6" fill="#FFFFFF" opacity=".85"/><circle cx="165" cy="135" r="2.6" fill="#FFFFFF" opacity=".85"/></g></g><ellipse cx="121" cy="164" rx="6" ry="3" fill="#FFB4C8" opacity=".55"/><ellipse cx="179" cy="164" rx="6" ry="3" fill="#FFB4C8" opacity=".55"/></g><g class="q"><text x="212" y="92" class="f-serif-bi" font-size="34" fill="#FFB4C8">?</text></g></g></g></svg>
