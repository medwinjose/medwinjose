<svg xmlns="http://www.w3.org/2000/svg" width="117" height="38" viewBox="0 0 117 38" role="img" aria-label="Linkedin"><title>Linkedin</title><style>@font-face { font-family: 'MJ-sans-m'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
