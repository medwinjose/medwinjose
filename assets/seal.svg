<svg xmlns="http://www.w3.org/2000/svg" width="326" height="300" viewBox="0 0 326 300" role="img" aria-label="MJ monogram"><title>MJ monogram</title><style>@font-face { font-family: 'MJ-sans-m'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'MJ-serif-bi'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 600; font-style: italic; }
.f-sans-m { font-family: 'MJ-sans-m', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 500; font-style: normal; }
.f-serif-bi { font-family: 'MJ-serif-bi', Georgia, 'Times New Roman', serif; font-weight: 600; font-style: italic; font-feature-settings: 'lnum' 1, 'kern' 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes drawx { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes drawy { from { transform: scaleY(0) } to { transform: scaleY(1) } }
@keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
.fb { transform-box: fill-box; }

.spin { transform-box: view-box; transform-origin: 150px 150px; animation: spin 80s linear infinite; }
.orb  { transform-box: view-box; transform-origin: 150px 150px; animation: spin 24s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg) } }
.mono { animation: fade 2s ease-out .4s both; }
</style><defs><path id="ring" d="M150.0 34.0 a116 116 0 1 1 -.01 0"/></defs><circle cx="150.0" cy="150.0" r="141" fill="none" stroke="#B8975A" stroke-width=".8" opacity=".55"/><circle cx="150.0" cy="150.0" r="134" fill="none" stroke="#B8975A" stroke-width=".5" opacity=".35"/><g class="spin"><text class="f-sans-m" font-size="12.5" fill="#B8975A" letter-spacing="3.41"><textPath href="#ring">DISTRIBUTED SYSTEMS  ·  FORMAL METHODS  ·  ADVERSARIAL ROBUSTNESS  ·  </textPath></text></g><circle cx="150.0" cy="150.0" r="97" fill="none" stroke="#B8975A" stroke-width=".8" opacity=".6"/><g class="orb"><circle cx="150.0" cy="53.0" r="2.4" fill="#B8975A"/></g><g class="mono"><text x="145" y="175" class="f-serif-bi" font-size="84" fill="#B8975A" text-anchor="middle" letter-spacing="-2">MJ</text><polygon points="150,199.6 152.4,202 150,204.4 147.6,202" fill="#B8975A" stroke="none" stroke-width="1" /></g></svg>
