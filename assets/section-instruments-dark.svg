<svg xmlns="http://www.w3.org/2000/svg" width="840" height="108" viewBox="0 0 840 108" role="img" aria-label="II. Instruments"><title>II. Instruments</title><style>@font-face { font-family: 'MJ-sans-m'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'MJ-serif'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'MJ-serif-bi'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 600; font-style: italic; }
.f-sans-m { font-family: 'MJ-sans-m', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 500; font-style: normal; }
.f-serif { font-family: 'MJ-serif', Georgia, 'Times New Roman', serif; font-weight: 500; font-style: normal; font-feature-settings: 'lnum' 1, 'kern' 1; }
.f-serif-bi { font-family: 'MJ-serif-bi', Georgia, 'Times New Roman', serif; font-weight: 600; font-style: italic; font-feature-settings: 'lnum' 1, 'kern' 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes drawx { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes drawy { from { transform: scaleY(0) } to { transform: scaleY(1) } }
@keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
.fb { transform-box: fill-box; }

.st { animation: rise 1.4s cubic-bezier(.16,1,.3,1) .1s both; }
.rl { transform-box: fill-box; transform-origin: 100% 50%; animation: drawx 1.5s cubic-bezier(.16,1,.3,1) .45s both; }
.rr { transform-box: fill-box; transform-origin: 0 50%; animation: drawx 1.5s cubic-bezier(.16,1,.3,1) .45s both; }
.ed { animation: fade 1s ease-out 1.6s both; }
.sb { animation: fade 1.4s ease-out .7s both; }
</style><g class="st"><text x="315.26" y="60" class="f-serif-bi" font-size="30" fill="#B7AAFF">II.</text><text x="352.94" y="60" class="f-serif" font-size="36" fill="#F4F1FB">Instruments</text></g><line class="rl" x1="78" y1="50" x2="285.26" y2="50" stroke="#B7AAFF" stroke-width=".8" opacity=".6"/><line class="rr" x1="554.74" y1="50" x2="762" y2="50" stroke="#B7AAFF" stroke-width=".8" opacity=".6"/><g class="ed"><polygon points="72,47.2 74.8,50 72,52.8 69.2,50" fill="#FFB4C8" stroke="none" stroke-width="1" /><polygon points="768,47.2 770.8,50 768,52.8 765.2,50" fill="#93E6CC" stroke="none" stroke-width="1" /></g><g class="sb"><text x="421.7" y="92" class="f-sans-m" font-size="9.5" fill="#9893AD" text-anchor="middle" letter-spacing="3.4">LANGUAGES, SYSTEMS  &amp;  METHODS</text></g></svg>
